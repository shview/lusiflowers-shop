<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__OG_TITLE__</title>
  <meta name="description" content="__OG_DESC__">
  <meta property="og:type" content="website">
  <meta property="og:title" content="__OG_TITLE__">
  <meta property="og:description" content="__OG_DESC__">
  <meta property="og:image" content="__OG_IMAGE__">
  <link rel="icon" href="__FAVICON_URL__">
  <script>
    // 防主题闪烁：渲染前应用已保存的偏好
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="/assets/style.css?v=9">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="/" id="site-name">商品展示</a>
      <div class="nav-right">
        <button class="nav-link" id="btn-announce" type="button" hidden>公告</button>
        <button class="nav-link" id="btn-search" type="button" aria-label="搜索" title="搜索商品">🔍</button>
        <button class="nav-link theme-toggle" id="theme-toggle" type="button" aria-label="切换主题" title="主题：跟随系统（点击切换）">🌓</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="searchbar" id="searchbar" hidden>
      <input type="search" id="search-input" class="input" placeholder="输入商品名称，即时过滤…" autocomplete="off">
      <button class="btn" id="search-clear" type="button" aria-label="清空">×</button>
    </div>

    <section class="tabs" id="tabs"></section>

    <section class="products" id="products">
      <div class="loading">努力加载中..</div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> <span id="footer-site-name"></span></span>
    </div>
  </footer>

  <template id="tpl-product">
    <div class="product-card card">
      <div class="product-link">
        <div class="product-thumb">
          <div class="soldout-tag" hidden>缺货</div>
          <img loading="lazy" alt="" draggable="false">
          <div class="product-noimg" hidden>暂无图片</div>
        </div>
        <div class="product-info">
          <div class="product-name"></div>
          <div class="product-desc"></div>
          <div class="product-price-row">
            <span class="product-price"></span>
            <span class="product-buy">查看详情 →</span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- 商品详情弹窗 -->
  <div class="detail-mask" id="detail-modal" hidden>
    <div class="detail card">
      <button class="detail-close" id="detail-close" type="button" aria-label="关闭">×</button>
      <div class="detail-body">
        <div class="carousel" id="carousel" hidden>
          <div class="carousel-stage">
            <img id="carousel-img" alt="" draggable="false">
            <button class="carousel-nav prev" id="carousel-prev" type="button" aria-label="上一张">‹</button>
            <button class="carousel-nav next" id="carousel-next" type="button" aria-label="下一张">›</button>
            <div class="carousel-counter" id="carousel-counter"></div>
          </div>
          <div class="carousel-dots" id="carousel-dots"></div>
        </div>
        <div class="detail-thumb" id="detail-noimg-wrap">
          <div class="product-noimg" id="detail-noimg">暂无图片</div>
        </div>
        <h2 class="detail-name" id="detail-name"></h2>
        <span class="detail-soldout" id="detail-soldout" hidden>缺货</span>
        <div class="detail-price" id="detail-price"></div>
        <div class="md-content" id="detail-desc"></div>
        <a class="btn-detail-link" id="detail-link" target="_blank" rel="noopener" hidden>了解详情 →</a>
      </div>
    </div>
  </div>

  <!-- 图片放大查看（灯箱） -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭">×</button>
    <button class="lightbox-nav prev" id="lightbox-prev" type="button" aria-label="上一张">‹</button>
    <img id="lightbox-img" alt="" draggable="false">
    <button class="lightbox-nav next" id="lightbox-next" type="button" aria-label="下一张">›</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <!-- 公告弹窗 -->
  <div class="detail-mask" id="announcement-modal" hidden>
    <div class="detail card announce-card">
      <button class="detail-close" id="announce-close" type="button" aria-label="关闭">×</button>
      <div class="announce-body">
        <h2 class="announce-title">公告</h2>
        <div class="md-content" id="announce-content"></div>
      </div>
    </div>
  </div>

    <!-- 访问密码锁屏（开启整站保护时显示） -->
  <div class="view-lock" id="view-lock" hidden>
    <form class="view-lock-card card" id="view-lock-form">
      <div class="view-lock-icon">🔒</div>
      <h2 class="view-lock-title">本站已开启访问密码</h2>
      <p class="view-lock-desc">请输入访问码查看内容</p>
      <input type="password" id="view-lock-input" class="input" placeholder="访问码" autocomplete="off" required>
      <button type="submit" class="btn-detail-link" style="border:none;cursor:pointer">进入</button>
      <div class="view-lock-error" id="view-lock-error"></div>
    </form>
  </div>
<script src="/assets/md.js?v=9"></script>
  <script src="/assets/app.js?v=9"></script>
</body>
</html>
