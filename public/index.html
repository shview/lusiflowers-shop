<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品展示</title>
  <meta name="description" content="">
  <link rel="icon" href="data:,">
  <script>
    // 防主题闪烁：渲染前应用已保存的偏好
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="/" id="site-name">商品展示</a>
      <div class="nav-right">
        <a class="nav-link" href="/">购物</a>
        <a class="nav-link" href="#announcement">公告</a>
        <button class="nav-link theme-toggle" id="theme-toggle" type="button" aria-label="切换主题" title="主题：跟随系统（点击切换）">🌓</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="announcement card" id="announcement" hidden>
      <div class="announcement-title">公告</div>
      <div class="announcement-body" id="announcement-body"></div>
    </section>

    <section class="tabs" id="tabs"></section>

    <section class="products" id="products">
      <div class="loading">努力加载中..</div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> <span id="footer-site-name"></span></span>
    </div>
  </footer>

  <template id="tpl-product">
    <div class="product-card card">
      <a class="product-link" target="_blank" rel="noopener">
        <div class="product-thumb">
          <div class="soldout-tag" hidden>缺货</div>
          <img loading="lazy" alt="">
          <div class="product-noimg" hidden>暂无图片</div>
        </div>
        <div class="product-info">
          <div class="product-name"></div>
          <div class="product-desc"></div>
          <div class="product-price-row">
            <span class="product-price"></span>
            <span class="product-buy">查看详情 →</span>
          </div>
        </div>
      </a>
    </div>
  </template>

  <!-- 商品详情弹窗 -->
  <div class="detail-mask" id="detail-modal" hidden>
    <div class="detail card">
      <button class="detail-close" id="detail-close" type="button" aria-label="关闭">×</button>
      <div class="detail-body">
        <div class="detail-thumb">
          <img id="detail-img" alt="" hidden>
          <div class="product-noimg" id="detail-noimg" hidden>暂无图片</div>
        </div>
        <h2 class="detail-name" id="detail-name"></h2>
        <span class="detail-soldout" id="detail-soldout" hidden>缺货</span>
        <div class="detail-price" id="detail-price"></div>
        <div class="md-content" id="detail-desc"></div>
        <a class="btn-detail-link" id="detail-link" target="_blank" rel="noopener" hidden>了解详情 →</a>
      </div>
    </div>
  </div>

  <script src="/assets/md.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
