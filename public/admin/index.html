<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理</title>
  <link rel="icon" href="data:,">
  <script>
    // 防主题闪烁：渲染前应用已保存的偏好
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="/admin/admin.css?v=7">
</head>
<body>
  <!-- 登录视图 -->
  <div id="view-login" class="login-wrap" hidden>
    <form class="login-card card" id="login-form">
      <h2 class="login-title">后台登录</h2>
      <input type="password" id="login-password" class="input" placeholder="请输入管理密码" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>

  <!-- 管理视图 -->
  <div id="view-admin" hidden>
    <nav class="nav">
      <div class="nav-inner">
        <span class="nav-brand">后台管理</span>
        <div class="nav-right">
          <a class="nav-link" href="/" target="_blank">查看网站 ↗</a>
          <a class="nav-link" href="javascript:void(0);" id="btn-logout">退出登录</a>
          <button class="nav-link theme-toggle" id="theme-toggle" type="button" aria-label="切换主题" title="主题：跟随系统（点击切换）">🌓</button>
        </div>
      </div>
    </nav>

    <main class="admin-main container">
      <div class="subtabs">
        <button class="subtab active" data-pane="products">商品管理</button>
        <button class="subtab" data-pane="categories">分类管理</button>
        <button class="subtab" data-pane="settings">站点设置</button>
      </div>

      <!-- 商品管理 -->
      <section class="pane" id="pane-products">
        <div class="pane-head">
          <h3>商品列表</h3>
          <button class="btn btn-primary" id="btn-new-product">＋ 新增商品</button>
        </div>
        <div class="product-table card" id="product-list">
          <div class="loading">加载中..</div>
        </div>
      </section>

      <!-- 分类管理 -->
      <section class="pane" id="pane-categories" hidden>
        <div class="pane-head">
          <h3>分类列表</h3>
        </div>
        <form class="cat-form card" id="cat-form">
          <input type="text" id="cat-name" class="input" placeholder="新分类名称" required>
          <button type="submit" class="btn btn-primary">添加分类</button>
        </form>
        <div class="cat-list card" id="cat-list"></div>
      </section>

      <!-- 站点设置 -->
      <section class="pane" id="pane-settings" hidden>
        <div class="pane-head">
          <h3>站点设置</h3>
        </div>
        <form class="settings-form card" id="settings-form">
          <label class="field">
            <span class="field-label">网站名称</span>
            <input type="text" id="set-site-name" class="input" placeholder="网站名称">
          </label>
          <label class="field">
            <span class="field-label">公告内容（换行有效，可直接粘贴链接）</span>
            <textarea id="set-announcement" class="input" rows="6" placeholder="公告内容"></textarea>
          </label>
          <label class="field check-field">
            <input type="checkbox" id="set-watermark" checked>
            <span>图片水印：上传时把站名水印烧入图片（原图另存不公开；关闭后仅新上传的图不再加水印）</span>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存设置</button>
            <span class="save-hint" id="settings-hint"></span>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- 商品编辑弹窗 -->
  <div class="modal-mask" id="product-modal" hidden>
    <div class="modal card">
      <div class="modal-head">
        <h3 id="modal-title">新增商品</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <form id="product-form" class="modal-body">
        <input type="hidden" id="f-id">
        <label class="field">
          <span class="field-label">商品名称 *</span>
          <input type="text" id="f-name" class="input" required maxlength="100">
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-label">分类</span>
            <select id="f-category" class="input"></select>
          </label>
          <div class="field">
            <span class="field-label">价格（纯数字自动显示 ¥）</span>
            <div class="price-modes">
              <label class="price-mode"><input type="radio" name="price-mode" value="single" checked>单价
                <input type="text" id="f-price-num" class="input price-num" inputmode="decimal" placeholder="199">
              </label>
              <label class="price-mode"><input type="radio" name="price-mode" value="range">区间
                <input type="text" id="f-price-min" class="input price-num" inputmode="decimal" placeholder="88"> -
                <input type="text" id="f-price-max" class="input price-num" inputmode="decimal" placeholder="188">
              </label>
              <label class="price-mode"><input type="radio" name="price-mode" value="custom">文字
                <input type="text" id="f-price-text" class="input price-num" placeholder="询价 / 面议">
              </label>
            </div>
          </div>
        </div>
        <div class="field">
          <span class="field-label">商品描述（Markdown 图文，可直接把图片拖进 / 粘贴到编辑区）</span>
          <div class="md-editor" id="md-editor">
            <div class="md-toolbar">
              <button type="button" class="md-btn" data-cmd="bold" title="加粗"><b>B</b></button>
              <button type="button" class="md-btn" data-cmd="italic" title="斜体"><i>I</i></button>
              <button type="button" class="md-btn" data-cmd="h" title="小节标题">H</button>
              <button type="button" class="md-btn" data-cmd="ul" title="列表">•</button>
              <button type="button" class="md-btn" data-cmd="link" title="插入链接">🔗</button>
              <button type="button" class="md-btn" data-cmd="image" title="插入图片">🖼</button>
              <span class="md-toolbar-hint">图片也可直接拖入 / 粘贴</span>
            </div>
            <textarea id="f-description" class="input md-textarea" rows="8" maxlength="5000" placeholder="描述内容…支持图文混排，把图片拖进这里即可上传"></textarea>
            <input type="file" id="f-desc-image-file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif" multiple hidden>
          </div>
          <div class="md-preview-wrap" id="md-preview-wrap" hidden>
            <div class="md-preview-title">预览（访客看到的效果）</div>
            <div class="md-preview" id="md-preview"></div>
          </div>
          <div class="md-editor-ops">
            <button type="button" class="btn btn-sm" id="btn-toggle-preview">预览</button>
            <span class="upload-hint" id="desc-upload-hint"></span>
          </div>
        </div>
        <label class="field">
          <span class="field-label">跳转链接（点击卡片后打开的网址，可留空）</span>
          <input type="url" id="f-link" class="input" placeholder="https://">
        </label>
        <div class="field">
          <span class="field-label">商品图片</span>
          <div class="upload-row">
            <div class="upload-preview" id="f-image-preview">无图片</div>
            <div class="upload-ops">
              <input type="file" id="f-image-file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif" hidden>
              <button type="button" class="btn" id="btn-upload">上传图片</button>
              <button type="button" class="btn btn-danger-ghost" id="btn-remove-image">移除图片</button>
              <div class="upload-hint" id="upload-hint">支持 JPG/PNG/GIF/WebP，10MB 以内；可直接拖拽图片到左侧预览框</div>
            </div>
          </div>
          <input type="hidden" id="f-image-url">
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">排序（数字越小越靠前）</span>
            <input type="number" id="f-sort" class="input" value="0">
          </label>
          <label class="field check-field">
            <input type="checkbox" id="f-visible" checked>
            <span>在网站上显示</span>
          </label>
          <label class="field check-field">
            <input type="checkbox" id="f-soldout">
            <span>缺货（排在最后、图片蒙灰）</span>
          </label>
        </div>
      </form>
      <div class="modal-foot">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/assets/md.js?v=7"></script>
  <script src="/admin/admin.js?v=7"></script>
</body>
</html>
